---
layout: default
---

<style>
/* 1. layout: default からの干渉を強制的にリセット */
.page-wrap {
  min-height: 100vh !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important; 
  padding: 40px 24px 100px !important; /* 歌詞ページと同期 */
  gap: 30px !important;
  width: 100% !important;
}

/* 2. 内枠：画面幅を超えないように制御 */
.inner {
  width: 100% !important;
  max-width: 600px !important; /* 歌詞ページの inner と同じ最大幅 */
  display: flex !important;
  flex-direction: column !important;
  align-items: flex-start !important; 
}

/* 3. ロゴ：歌詞ページの「40px」と完全に一致させる */
.site-header {
  width: 100% !important;
  text-align: left !important;
}

.site-header span {
  font-family: 'Aboreto', cursive !important;
  font-size: 40px !important; /* 50から40に変更。これで歌詞ページと重なります */
  line-height: 1.0 !important;
  display: inline-block !important;
}

/* 4. 画像：横幅いっぱいに収める */
.main-img {
  width: 100% !important;
  height: auto !important;
  margin-top: 20px !important;
  display: block !important;
}

/* 5. リンク：大きすぎるのを抑制 */
.bottom-row {
  width: 100% !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: flex-start !important;
  gap: 15px !important;
  margin-top: 30px !important;
}

.bottom-row a {
  font-family: 'Aboreto', cursive !important;
  font-size: 20px !important; /* 少し控えめに調整 */
  text-decoration: none !important;
  color: inherit !important;
}

/* 固定要素 */
.get-in-touch, .copy {
  right: 24px !important;
  text-align: right !important;
}
</style>

<div class="page-wrap">
  <div class="inner">
    
    <div class="site-header">
      <span>JE'M</span>
    </div>

    <img class="main-img" src="{{ '/jem2.jpg' | relative_url }}">

    <div class="bottom-row">
      <a href="{{ '/lyrics' | relative_url }}">LYRICS</a>
      <a href="https://music.apple.com/jp/artist/jem/1864719862?l=en-US" target="_blank">APPLE MUSIC</a>
      <a href="https://jemmusicja.bandcamp.com" target="_blank">BANDCAMP</a>
    </div>

  </div>
</div>

<div class="get-in-touch">
  <a href="mailto:floribundatunes@duck.com">GET IN TOUCH</a>
</div>

<div class="copy">© All rights reserved</div>
