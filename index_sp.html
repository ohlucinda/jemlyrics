---
layout: default
---

<style>
/* 1. 歌詞一覧ページの基本ルールを完全移植 */
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  background: white;
}

/* 2. スマホでの「正しい位置」を再現 */
.page-wrap-sp {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center; /* 歌詞一覧と同じく中央寄せにしてから、中のinnerで左に寄せる */
  padding: 40px 24px 100px; /* 歌詞一覧のスマホ設定と完全一致 */
}

.inner-sp {
  width: 600px;
  max-width: 90%; /* 歌詞一覧の .inner と完全一致 */
  display: flex;
  flex-direction: column;
  align-items: flex-start; /* 中身を左に揃える */
}

/* 3. ロゴのサイズを 50px に同期 */
.site-header-sp a {
  font-family: 'Aboreto', cursive;
  font-size: 40px; /* 歌詞一覧のスマホ設定（@media 768px）と完全一致 */
  text-decoration: none;
  color: inherit;
  line-height: 1;
}

/* 4. メッセージ部分のデザイン */
.statement {
  margin-top: 125px; /* 歌詞一覧の .list の margin-top と一致させています */
  font-family: serif;
  font-size: 20px;
  color: black;
  line-height: 1.6;
}

.enter-link {
  margin-top: 50px; /* 歌詞一覧のリストの間隔（gap）と一致 */
  font-family: 'Aboreto', cursive;
  font-size: 16px; /* 歌詞一覧の a と一致 */
  text-decoration: none;
  color: #888;
  border-bottom: 1px solid #eee;
  padding-bottom: 4px;
}
</style>

<div class="page-wrap-sp">
  <div class="inner-sp">
    
    <div class="site-header-sp">
      <a href="{{ '/' | relative_url }}">JE'M</a>
    </div>

    <div class="statement">
      Designed for Mac, PC and iPad.
    </div>
    
    <a href="{{ '/lyrics' | relative_url }}" class="enter-link">ENTER LYRICS</a>

  </div>
</div>
