layout: default
---

<style>
/* 1. スマホ専用のリセット（Macの設定を一切持ち込まない） */
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  background: white;
  -webkit-text-size-adjust: 100%;
}

/* 2. 外枠：歌詞ページのスマホ表示とピタリと合わせる */
.page-wrap {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center; /* 中央に置いてからinnerで制御 */
  padding: 40px 24px 100px; /* 歌詞ページの 40px 24px と同期 */
}

/* 3. 内枠：歌詞ページの .inner (width: 600px, max-width: 90%) を再現 */
.inner {
  width: 600px;
  max-width: 90%; 
  display: flex;
  flex-direction: column;
  align-items: flex-start; /* これで「JE'M」が左のラインに吸い付く */
}

/* 4. ロゴ：歌詞ページの 50px と完全一致 */
.site-header {
  width: 100%;
  text-align: left;
  margin: 0;
  padding: 0;
}

.site-header span {
  font-family: 'Aboreto', cursive;
  font-size: 50px; /* ここが 50px なら歌詞ページと同じ大きさになります */
  line-height: 1;
  display: inline-block;
}

/* 5. 画像とリンク */
.main-img {
  width: 100%;
  height: auto;
  margin-top: 30px;
  display: block;
}

.bottom-row {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 20px;
  margin-top: 40px;
}

.bottom-row a {
  font-family: 'Aboreto', cursive;
  font-size: 22px;
  text-decoration: none;
  color: inherit;
}

/* 固定要素（GET IN TOUCH など） */
.get-in-touch {
  position: fixed;
  bottom: 100px;
  right: 24px;
  font-size: 14px;
}

.copy {
  position: fixed;
  bottom: 60px;
  right: 24px;
  font-size: 12px;
}
</style>

<div class="page-wrap">
  <div class="inner">
    
    <div class="site-header">
      <span>JE'M</span>
    </div>

    <img class="main-img" src="{{ '/jem2.jpg' | relative_url }}">

    <div class="bottom-row">
      <a href="{{ '/lyrics' | relative_url }}">LYRICS</a>
      <a href="https://music.apple.com/jp/artist/jem/1864719862?l=en-US" target="_blank">APPLE MUSIC</a>
      <a href="https://jemmusicja.bandcamp.com" target="_blank">BANDCAMP</a>
    </div>

  </div>
</div>

<div class="get-in-touch">
  <a href="mailto:floribundatunes@duck.com">GET IN TOUCH</a>
</div>

<div class="copy">© All rights reserved</div>
