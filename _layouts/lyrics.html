<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://use.typekit.net/qsa5fag.css">
<link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  font-family: 'Aboreto', cursive;
  margin: 0;
  padding: 0;
  color: #333;
}

a { text-decoration: none; color: inherit; }

/* 全体 */
.page-wrap {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 40px 100px;
  gap: 40px;
}

/* 共通の軸 */
.inner {
  width: 600px;
  max-width: 90%;
}

/* タイトル */
.site-header a {
  font-size: 70px;
}

/* 歌詞 */
.lyrics-content {
  font-family: "adobe-caslon-pro", serif;
  font-size: 18px;
  line-height: 2.2;
  letter-spacing: 0;
  white-space: pre-wrap;
  margin-top: 27px;
}

/* 英語 */
.en {
  font-size: 19px;
}

/* BACK */
.back {
  position: fixed;
  bottom: 60px;
  right: 100px;
}

.back a { font-size: 14px; }

/* スマホ */
@media (max-width: 768px) {
  .page-wrap { padding: 40px 24px 100px; }
  .site-header a { font-size: 50px; }

  .lyrics-content {
  font-size: 16px;
  margin-top: 5px;
}

  .back { right: 24px; }
}
</style>
</head>

<body>

<div class="page-wrap">

  <div class="inner">

    <div class="site-header">
      <a href="{{ '/' | relative_url }}">JE'M</a>
    </div>

    <div class="lyrics-content">
      {{ content }}
    </div>

  </div>

</div>

<div class="back">
  <a href="{{ '/lyrics' | relative_url }}">BACK TO LYRICS</a>
</div>

<script>
function wrapEnglish(node) {
  if (node.nodeType === 3) {
    const text = node.textContent;
    if (/[A-Za-z]/.test(text)) {
      const span = document.createElement('span');
      span.innerHTML = text.replace(
        /([A-Za-z][A-Za-z0-9'".,!?\- ]*)/g,
        '<span class="en">$1</span>'
      );
      node.parentNode.replaceChild(span, node);
    }
  } else if (
    node.nodeType === 1 &&
    !node.hasAttribute('style') &&
    node.tagName !== 'IFRAME'
  ) {
    Array.from(node.childNodes).forEach(wrapEnglish);
  }
}

wrapEnglish(document.querySelector('.lyrics-content'));
</script>

</body>
</html>
