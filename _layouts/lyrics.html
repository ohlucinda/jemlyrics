<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Aboreto', cursive;
  max-width: 800px;
  margin: 60px auto;
  font-size: 28px;
  line-height: 1.6;
  white-space: pre-wrap;
}

a {
  text-decoration: none;
  color: inherit;
}

.title {
  text-align: center;   /* ← Je'mは中央 */
  margin-bottom: 40px;
  font-size: 44px;
}

.list {
  text-align: center;   /* ← 一覧も中央 */
  margin-top: 40px;
}

.list a {
  font-size: 36px;
}

.list div {
  margin: 10px 0;       /* ← 元の自然な間隔 */
}

.back {
  margin-top: 30px;
  text-align: center;
}

.back a {
  font-size: 28px;
}
</style>

</head>

<body>

<div class="title">Je'm</div>

{{ content }}

<div class="list">
  {% for post in site.posts %}
    <div>
      <a href="{{ post.url | relative_url }}">
        {{ post.title | upcase }}
      </a>
    </div>
  {% endfor %}
</div>

<div class="back">
  <a href="{{ '/' | relative_url }}">BACK TO HOME</a>
</div>

</body>
</html>
