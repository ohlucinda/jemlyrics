<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body { font-family: 'Aboreto', cursive; margin: 0; padding: 0; }
a { text-decoration: none; color: inherit; }
.page-wrap {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 40px;
  gap: 40px;
}
.site-header a { font-size: 100px; }
.lyrics-content {
  font-size: 28px;
  line-height: 2;
  text-align: center;
  white-space: pre-wrap;
}
.back { margin-top: auto; }
.back a { font-size: 32px; }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="site-header">
    <a href="{{ '/' | relative_url }}">JE'M</a>
  </div>
  <div class="lyrics-content">
    {{ content }}
  </div>
  <div class="back">
    <a href="{{ '/lyrics' | relative_url }}">BACK TO LYRICS</a>
  </div>
</div>
</body>
</html>
