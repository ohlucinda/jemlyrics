<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Aboreto', cursive;
  margin: 60px 0 60px 120px;
  font-size: 28px;
  line-height: 1.6;
  white-space: pre-wrap;
}

/* Je'm */
.title {
  font-size: 44px;
  margin-bottom: 10px;  /* ← タイトルとの距離を詰める */
}

/* 一覧 */
.list {
  margin-top: 10px;     /* ← ここで位置調整（重要） */
}

.list a {
  font-size: 36px;
}

.list div {
  margin: 0;           /* ← タイトル同士の間隔を最小に */
}

/* 戻るリンク */
.back {
  margin-top: 30px;
  text-align: center;
}

.back a {
  font-size: 28px;
}
</style>

</head>

<body>

<div class="title">Je'm</div>

{{ content }}

<div class="list">
  {% for post in site.posts %}
    <div>
      <a href="{{ post.url | relative_url }}">
        {{ post.title | upcase }}
      </a>
    </div>
  {% endfor %}
</div>

<div class="back">
  <a href="{{ '/' | relative_url }}">BACK TO HOME</a>
</div>

</body>
</html>
