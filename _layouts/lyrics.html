<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Aboreto', cursive;
  max-width: 800px;
  margin: 60px auto;
  font-size: 26px; /* ← 小さく戻した */
  line-height: 1.6;
  white-space: pre-wrap;
  text-align: left; /* ← 左寄せ */
}

a {
  text-decoration: none;
  color: inherit;
}

.title {
  text-align: center;
  margin-bottom: 40px;
  font-size: 24px;
}

.list {
  text-align: center;
  margin-top: 60px;
}

.back {
  text-align: center;
  margin-top: 20px;
  font-size: 16px;
}
</style>

</head>

<body>

<div class="title">Je'm</div>

{{ content }}

{% if page.url == '/lyrics/' %}
  <div class="list">
    {% for post in site.posts %}
      <div style="margin: 20px 0;">
        <a href="{{ post.url | relative_url }}">
          {{ post.slug | replace: '-', ' ' | upcase }}
        </a>
      </div>
    {% endfor %}
  </div>
{% endif %}

<div class="back">
  <a href="{{ '/' | relative_url }}">BACK TO HOME</a>
</div>

</body>
</html>
