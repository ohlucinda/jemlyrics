<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Montserrat:wght@400&family=Zen+Maru+Gothic:wght@400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body { font-family: 'Aboreto', cursive; margin: 0; padding: 0; }
a { text-decoration: none; color: inherit; }
.page-wrap {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 40px 100px;
  gap: 40px;
}
.site-header a { font-size: 70px; }
.lyrics-content {
  font-family: 'Montserrat', 'Zen Maru Gothic', sans-serif;
  font-weight: 400; /* 標準的な太さ */
  font-size: 18px;
  line-height: 2.2;
  text-align: left;
  white-space: pre-wrap;
  width: 60%;
  margin-left: 10%;
  letter-spacing: 0.05em;
}
