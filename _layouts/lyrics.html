<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Aboreto', cursive;
  margin: 60px 0 60px 120px;
  font-size: 28px;
  line-height: 1.6;
  white-space: pre-wrap;
}

a {
  text-decoration: none;
  color: inherit;
}

.title {
  font-size: 44px;
  margin-bottom: 20px;
}

/* 一覧ページだけ中央 */
body.list .title {
  text-align: center;
}

/* 一覧 */
.list a {
  font-size: 36px;
}

.list div {
  margin: 2px 0;   /* ← 間隔詰めた */
}

/* 戻るリンク */
.back {
  margin-top: 30px;
  text-align: center;
}

.back a {
  font-size: 28px;
}
</style>

</head>

<body class="{% if page.url contains 'lyrics' %}list{% endif %}">

<div class="title">Je'm</div>

{{ content }}

{% if page.url contains 'lyrics' %}
  <div class="list">
    {% for post in site.posts %}
      <div>
        <a href="{{ post.url | relative_url }}">
          {{ post.title | upcase }}
        </a>
      </div>
    {% endfor %}
  </div>
{% else %}
  <div class="back">
    <a href="{{ '/lyrics' | relative_url }}">BACK TO TITLES</a>
  </div>
{% endif %}

</body>
</html>
