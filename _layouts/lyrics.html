<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Aboreto', cursive;
  max-width: 800px;
  margin: 40px auto;   /* ← 上の余白も少し詰めた */
  padding: 0 10px;     /* ← 左に寄せる */
  font-size: 28px;
  line-height: 1.6;
  white-space: pre-wrap;
  text-align: left;
}

a {
  text-decoration: none;
  color: inherit;
}

.title {
  text-align: left;     /* ← 中央やめる */
  margin-bottom: 30px;
  font-size: 44px;
}

.list {
  text-align: left;
  margin-top: 20px;     /* ← 詰める */
}

.list a {
  font-size: 36px;
}

.back {
  text-align: left;     /* ← 揃える */
  margin-top: 16px;
  font-size: 18px;
}
</style>

</head>

<body>

<div class="title">Je'm</div>

{{ content }}

<div class="list">
  {% for post in site.posts %}
    <div style="margin: 4px 0;">   <!-- ← ここが間隔 -->
      <a href="{{ post.url | relative_url }}">
        {{ post.path | split: '/' | last | remove: '.md' | slice: 11, 100 | replace: '-', ' ' | upcase }}
      </a>
    </div>
  {% endfor %}
</div>

<div class="back">
  <a href="{{ '/' | relative_url }}">BACK TO HOME</a>
</div>

</body>
</html>
