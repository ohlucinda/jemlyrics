<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: 'Aboreto', cursive;
  margin: 0;
  padding: 0;
}

a {
  text-decoration: none;
  color: inherit;
}

.page-wrap {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 40px;
  gap: 50px;
}

.site-header a {
  font-size: 100px;
  text-decoration: none;
  color: inherit;
}

.list {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 30px;
}

.list a {
  font-size: 44px;
  text-decoration: none;
  color: inherit;
}

.back a {
  font-size: 22px;
  text-decoration: none;
  color: inherit;
}
</style>

</head>
<body>

<div class="page-wrap">

  <div class="site-header">
    <a href="{{ '/' | relative_url }}">JE'M</a>
  </div>

  <div class="list">
    {% for post in site.posts %}
      <a href="{{ post.url | relative_url }}">{{ post.title | upcase }}</a>
    {% endfor %}
  </div>

  <div class="back">
    <a href="{{ '/' | relative_url }}">BACK TO HOME</a>
  </div>

</div>

</body>
</html>
