<style>
body {
  margin: 0;
  padding: 0;
}

/* 背景 */
.bg {
  position: fixed;
  top: -200px;
  left: 0;
  width: 100%;
  height: calc(100% + 200px);
  object-fit: cover;
}

/* ───────────────────────────────────────
   【基本エリア】
   ※ 主に iPad横向き（ベース）に合わせた数値にします
   ─────────────────────────────────────── */
.top {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'adobe-caslon-pro', serif;
  font-size: 48px;
  letter-spacing: 0.08em;
  
  top: 180px; /* ◎ iPad横向きでちょうどいい位置に調整してください */
}

a:hover {
  color: #888;
}
  
.lyrics-link {
  text-decoration: underline;
  text-underline-offset: 6px;
  text-decoration-thickness: 1.5px;
}

.back {
  position: fixed;
  bottom: 60px;
  right: 100px;
}

.back a {
  font-size: 14px;
}
  
/* ───────────────────────────────────────
   端末・画面の向きごとの完全独立部屋（最新・完全版）
   ─────────────────────────────────────── */

/* 1. 【iPhoneの縦向き】専用 */
@media (max-width: 450px) and (orientation: portrait) {
  .top { top: 270px; font-size: 48px; }
}

/* 2. 【iPhoneの横向き】専用 */
@media (max-width: 950px) and (max-height: 450px) and (orientation: landscape) {
  .top { top: 74px; font-size: 36px; }
}

/* 4. 【普通のiPad / iPad Pro】専用（縦・横） */
@media (min-width: 769px) and (max-width: 1180px) and (orientation: portrait) {
  .top { top: 500px; font-size: 50px; }
}
@media (min-width: 1025px) and (max-width: 1336px) and (orientation: landscape) {
  .top { top: 280px; font-size: 50px; }
}

/* 5. 【Mac / デスクトップ】専用 */
@media (min-width: 1367px) {
  .top { top: 440px; font-size: 70px; }
  
/* Macだけ */
  .footer a:hover {
    color: #888 !important;
  }
}
  
</style>
</body>
</html>
