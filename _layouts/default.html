<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
<link rel="stylesheet" href="https://use.typekit.net/qsa5fag.css">
</head>
<body>
<img src="/fingg-555.jpg" class="bg">
<div class="top">
  <a href="/titles" class="lyrics-link">Lyrics</a>
</div>
<div class="footer">
  <div class="touch">
    <a href="mailto:floribundatunes@duck.com">GET IN TOUCH</a>
  </div>
  <div class="part">
    <em>Je'm is part of</em> OHLUCINDA
  </div>
  <div class="links">
    <a href="/titles">Lyrics</a> |
    <a href="/songs">Songs</a> |
    <a href="/images">Images</a>
  </div>
  <div class="copyright">
    © 2024 All rights reserved
  </div>
</div>
<style>
body {
  margin: 0;
  padding: 0;
}
/* 背景 */
.bg {
  position: fixed;
  top: -200px;
  left: 0;
  width: 100%;
  height: calc(100% + 200px);
  object-fit: cover;
}
/* LYRICS */
.top {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'adobe-caslon-pro', serif;
  font-size: 48px;
  letter-spacing: 0.08em;
}
a {
  color: black;
  text-decoration: none;
  transition: opacity 0.2s ease;
}
a:active {
  opacity: 0.5;
}
.lyrics-link {
  text-decoration: underline;
  text-underline-offset: 6px;
  text-decoration-thickness: 1.5px;
}
/* フッター */
.footer {
  position: fixed;
  bottom: 38px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  font-family: 'adobe-caslon-pro', serif;
  color: black;
  width: 100%;
  line-height: 1.6;
}
.touch {
  font-size: 16px;
  margin-bottom: 6px;
}
.part {
  font-size: 14px;
  margin-bottom: 6px;
}
.links {
  font-size: 14px;
  margin-bottom: 6px;
}
.copyright {
  font-size: 13px;
}
.footer a {
  color: black;
}

/* スマホ 縦向き (変更なし) */
@media (max-width: 767px) and (orientation: portrait) {
  .top {
    top: 310px;
  }
}

/* スマホ 横向き (変更なし) */
@media (max-width: 950px) and (orientation: landscape) {
  .top {
    top: 80px;
  }
}

/* iPad Air 2 / iPad mini 5 縦向き (確実に検知できるように範囲を修正) */
@media (min-width: 768px) and (max-width: 1023px) and (orientation: portrait) {
  .top {
    top: 360px; /* 背景ロゴの真上に重なる位置 */
  }
  .footer {
    bottom: 38px; /* 元の位置をキープ */
  }
}

/* iPad Air 2 / iPad mini 5 横向き */
@media (min-width: 1024px) and (max-width: 1024px) and (orientation: landscape) {
  .top {
    top: 180px; /* 横向きの画面の高さに合わせたロゴ位置 */
  }
  .footer {
    bottom: 38px; /* 元の位置をキープ */
  }
}

/* iPad 全体（その他のタブレット等：数値を整理） */
@media (min-width: 769px) and (max-width: 1023px) and (orientation: landscape) {
  .top {
    top: 700px;
  }
}
  
/* Mac / デスクトップ (iPad横向きと被らないよう1025px以上に設定) */
@media (min-width: 1025px) {
  .top {
    top: 550px;
  }
}
</style>
</body>
</html>
