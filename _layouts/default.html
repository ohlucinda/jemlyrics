<style>
body {
  margin: 0;
  padding: 0;
}

/* 背景 */
.bg {
  position: fixed;
  top: -200px;
  left: 0;
  width: 100%;
  height: calc(100% + 200px);
  object-fit: cover;
}

/* ───────────────────────────────────────
   【基本エリア】
   ※ 主に iPad横向き（ベース）に合わせた数値にします
   ─────────────────────────────────────── */
.top {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'adobe-caslon-pro', serif;
  font-size: 48px;
  letter-spacing: 0.08em;
  
  top: 180px; /* ◎ iPad横向きでちょうどいい位置に調整してください */
}

.footer {
  position: fixed;
  bottom: 38px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  font-family: 'adobe-caslon-pro', serif;
  color: black;
  width: 100%;
  line-height: 1.6;
}

a {
  color: black;
  text-decoration: none;
  transition: color 0.3s ease;
}

a:hover {
  color: #888;
}
  
.lyrics-link {
  text-decoration: underline;
  text-underline-offset: 6px;
  text-decoration-thickness: 1.5px;
}
.touch {
  font-size: 16px;
  margin-bottom: 6px;
}
.part {
  font-size: 14px;
  margin-bottom: 6px;
}
.links {
  font-size: 14px;
  margin-bottom: 6px;
}
.copyright {
  font-size: 13px;
}

.footer a:hover {
  color: #888;
}
  
/* ───────────────────────────────────────
   端末・画面の向きごとの完全独立部屋（最新・完全版）
   ─────────────────────────────────────── */

/* 1. 【iPhoneの縦向き】専用
   縦画面で一番綺麗に見えていた元のバランス */
@media (max-width: 450px) and (orientation: portrait) {
  .top {
    top: 310px;
    font-size: 48px;
  }
}

/* 2. 【iPhoneの横向き】専用
   高さが狭い画面に合わせて、位置とサイズを個別に救済 */
@media (max-width: 950px) and (max-height: 450px) and (orientation: landscape) {
  .top {
    top: 70px;
    font-size: 36px;
  }
}

/* 3. 【iPadの縦向き】専用（iPad miniの縦向きもここ）
   これまでの理想のバランス */
@media (min-width: 451px) and (max-width: 820px) and (orientation: portrait) {
  .top {
    top: 500px;
    font-size: 60px;
  }
}

/* 4-A. 【iPad miniの横向き】専用 ★ここだけ独立
   横幅が1024pxまでの小ぶりなiPad横向き */
@media (min-width: 700px) and (max-width: 1024px) and (orientation: landscape) {
  .top {
    top: 120px;       /* 💡iPad miniの横向きを見ながら、この数値だけを好きな位置に微調整してください */
    font-size: 50px;
  }
}

/* 4-B. 【普通のiPad / iPad Proの横向き】専用 ★ここも独立
   今「いい感じ」に見えている大きなiPadのバランスをそのまま固定 */
@media (min-width: 1025px) and (max-width: 1366px) and (orientation: landscape) {
  .top {
    top: 300px;
    font-size: 60px;
  }
}

/* 5. 【Mac / デスクトップ】専用
   今「いい感じ」に見えているMacの特大サイズをそのまま固定 */
@media (min-width: 1367px) {
  .top {
    top: 540px;
    font-size: 70px;
  }
  /* 💡Macのとき、フッター内のリンクにマウスを乗せたら何よりも最優先で色を変える命令 */
  .footer a:hover {
    color: #888 !important;
  }
}
</style>
