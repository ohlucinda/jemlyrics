<style>
body {
  margin: 0;
  padding: 0;
}

/* 背景 */
.bg {
  position: fixed;
  top: -200px;
  left: 0;
  width: 100%;
  height: calc(100% + 200px);
  object-fit: cover;
}

/* ───────────────────────────────────────
   【基本エリア】
   ※ 主に iPad横向き（ベース）に合わせた数値にします
   ─────────────────────────────────────── */
.top {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'adobe-caslon-pro', serif;
  font-size: 48px;
  letter-spacing: 0.08em;
  
  top: 180px; /* ◎ iPad横向きでちょうどいい位置に調整してください */
}

.footer {
  position: fixed;
  bottom: 38px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  font-family: 'adobe-caslon-pro', serif;
  color: black;
  width: 100%;
  line-height: 1.6;
}

a {
  color: black;
  text-decoration: none;
  transition: color 0.3s ease;
}

a:hover {
  color: #888;
}
  
.lyrics-link {
  text-decoration: underline;
  text-underline-offset: 6px;
  text-decoration-thickness: 1.5px;
}
.touch {
  font-size: 16px;
  margin-bottom: 6px;
}
.part {
  font-size: 14px;
  margin-bottom: 6px;
}
.links {
  font-size: 14px;
  margin-bottom: 6px;
}
.copyright {
  font-size: 13px;
}

.footer a:hover {
  color: #888;
}
  
/* ───────────────────────────────────────
   端末・画面の向きごとの完全独立部屋（最新・完全版）
   ─────────────────────────────────────── */

/* 1. 【iPhoneの縦向き】専用 */
@media (max-width: 450px) and (orientation: portrait) {
  .top { top: 310px; font-size: 48px; }
}

/* 2. 【iPhoneの横向き】専用 */
@media (max-width: 950px) and (max-height: 450px) and (orientation: landscape) {
  .top { top: 70px; font-size: 36px; }
}

/* 3. 【iPad mini】専用（縦・横） */
@media (width: 768px) and (height: 1024px) and (orientation: portrait) {
  .top { top: 400px; font-size: 55px; }
}
@media (width: 1024px) and (height: 768px) and (orientation: landscape) {
  .top { top: 120px; font-size: 50px; }
}

/* 4. 【普通のiPad / iPad Pro】専用（縦・横） */
@media (min-width: 769px) and (max-width: 1366px) and (orientation: portrait) {
  .top { top: 500px; font-size: 60px; }
}
@media (min-width: 1025px) and (max-width: 1366px) and (orientation: landscape) {
  .top { top: 300px; font-size: 60px; }
}

/* 5. 【Mac / デスクトップ】専用 */
@media (min-width: 1367px) {
  .top { top: 540px; font-size: 70px; }
}
  /* 💡Macのとき、フッター内のリンクにマウスを乗せたら何よりも最優先で色を変える命令 */
  .footer a:hover {
    color: #888 !important;
  }
}
</style>
