<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
<link rel="stylesheet" href="https://use.typekit.net/qsa5fag.css">
</head>
<body>
<img src="/fingg-555.jpg" class="bg">
<div class="top">
  <a href="/titles" class="lyrics-link">Lyrics</a>
</div>
<div class="footer">
  <div class="touch">
    <a href="mailto:floribundatunes@duck.com">GET IN TOUCH</a>
  </div>
  <div class="part">
    <em>Je'm is part of</em> OHLUCINDA
  </div>
  <div class="links">
    <a href="/titles">Lyrics</a> |
    <a href="/songs">Songs</a> |
    <a href="/images">Images</a>
  </div>
  <div class="copyright">
    © 2024 All rights reserved
  </div>
</div>
<style>
body {
  margin: 0;
  padding: 0;
}
/* 背景 */
.bg {
  position: fixed;
  top: -200px;
  left: 0;
  width: 100%;
  height: calc(100% + 200px);
  object-fit: cover;
}
/* LYRICS */
.top {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'adobe-caslon-pro', serif;
  font-size: 48px;
  letter-spacing: 0.08em;
}
a {
  color: black;
  text-decoration: none;
  transition: opacity 0.2s ease;
}
a:active {
  opacity: 0.5;
}
.lyrics-link {
  text-decoration: underline;
  text-underline-offset: 6px;
  text-decoration-thickness: 1.5px;
}
/* フッター */
.footer {
  position: fixed;
  bottom: 38px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  font-family: 'adobe-caslon-pro', serif;
  color: black;
  width: 100%;
  line-height: 1.6;
}
.touch {
  font-size: 16px;
  margin-bottom: 6px;
}
.part {
  font-size: 14px;
  margin-bottom: 6px;
}
.links {
  font-size: 14px;
  margin-bottom: 6px;
}
.copyright {
  font-size: 13px;
}
.footer a {
  color: black;
}

/* スマホ 縦向き (変更なし) */
@media (max-width: 767px) and (orientation: portrait) {
  .top {
    top: 310px;
  }
}

/* スマホ 横向き (変更なし) */
@media (max-width: 950px) and (orientation: landscape) {
  .top {
    top: 80px;
  }
}

/* スマホ 横向き（現在の状態をキープ） */
@media (max-width: 950px) and (orientation: landscape) {
  .top {
    top: 80px;
  }
}

/* ===================================================
   iPad Air 2 / iPad mini 5 専用の指定
   （他のコードに上書きされないよう、!important で位置を絶対固定します）
   =================================================== */

/* iPad 縦向き（miniのサイズズレを想定して760px〜790pxまでカバー） */
@media (min-width: 760px) and (max-width: 790px) and (orientation: portrait) {
  .top {
    top: 200px !important; /* Airの縦でうまくいっていた数値を強制適用 */
  }
  .footer {
    bottom: 38px !important;
  }
}

/* iPad 横向き（Mac用コードに邪魔されないよう1000px〜1024pxでホールド） */
@media (min-width: 1000px) and (max-width: 1024px) and (orientation: landscape) {
  .top {
    top: 0 !important; /* 横向きのときに一番綺麗に見える位置 */
  }
  .footer {
    bottom: 38px !important;
  }
}

/* ===================================================
   その他のデバイス（干渉を防ぐために数値を綺麗に切り分け）
   =================================================== */

/* iPad 全体（その他のタブレット用：干渉しないサイズに退避） */
@media (min-width: 791px) and (max-width: 999px) {
  .top {
    top: 700px;
  }
}
  
/* Mac / デスクトップ（iPadの1024pxと絶対に被らないよう、1025pxからスタート） */
@media (min-width: 1025px) {
  .top {
    top: 550px;
  }
}
  
/* Mac / デスクトップ (iPad横向きと被らないよう1025px以上に設定) */
@media (min-width: 1025px) {
  .top {
    top: 550px;
  }
}
</style>
</body>
</html>
