<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Aboreto', cursive;
  max-width: 800px;
  margin: 40px auto;
  line-height: 1.6;
  white-space: pre-wrap;
}

a {
  text-decoration: none;
  color: inherit;
}
</style>
</head>

<body>

<h1>Je'm</h1>

{{ content }}

{% if page.url != '/' %}
  <div style="margin-top: 0px; text-align: center;">
    <a href="{% if page.url == '/lyrics/' %}{{ '/' | relative_url }}{% else %}{{ '/lyrics' | relative_url }}{% endif %}" style="font-size: 14px;">
      {% if page.url == '/lyrics/' %}BACK TO HOME{% else %}BACK TO TITLES{% endif %}
    </a>
  </div>
{% endif %}

</body>
</html>
