<!DOCTYPE html>
<html lang="en">

<head>

<body>

<div class="footer">

  <div class="touch">

  </div>

  <div class="part">

<style>

body {
  margin: 0;
  padding: 0;
}

/* 背景 */
.bg {
  position: fixed;
  top: -200px;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* LYRICS */
.top {
  position: fixed;
  top: 310px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'adobe-caslon-pro', serif;
  font-size: 48px;
  letter-spacing: 0.08em;
}

a {
  color: black;
  text-decoration: none;
  transition: opacity 0.2s ease;
}

a:active {
  opacity: 0.5;
}

.lyrics-link {
  text-decoration: underline;
  text-underline-offset: 6px;
  text-decoration-thickness: 1.5px;
}

/* フッター */
.footer {
  position: fixed;
  bottom: 38px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  font-family: 'adobe-caslon-pro', serif;
  color: black;
  width: 100%;
  line-height: 1.6;
}

.touch {
  font-size: 16px;
  margin-bottom: 6px;
}

.part {
  font-size: 14px;
  margin-bottom: 6px;
}

.links {
  font-size: 14px;
  margin-bottom: 6px;
}

.copyright {
  font-size: 13px;
}

.footer a {
  color: black;
}


/* スマホ 縦向き */
@media (max-width: 768px) and (orientation: portrait) {

  .top {
    top: 310px;
  }

}

/* スマホ 横向き */
@media (max-width: 768px) and (orientation: landscape) {

  .top {
    top: 80px;
  }

}

/* iPad mini 縦向き */
@media (min-width: 769px) and (max-width: 834px) and (orientation: portrait) {

  .top {
    top: 500px;
  }

}

/* iPad mini 横向き */

@media (min-width: 769px) and (max-width: 834px) and (orientation: landscape) {

  .bg {

    top: -120px;

  }

  .top {

  top: -100px !important;

}

}

/* iPad Air 2 縦向き */
@media (min-width: 835px) and (max-width: 1024px) and (orientation: portrait) {

  .top {
    top: 500px;
  }

}

/* iPad Air 2 横向き */

@media (min-width: 769px) and (max-width: 834px) and (orientation: landscape) {

  .bottom-row {
    margin-top: -120px !important;
  }

}

/* Mac / デスクトップ */
@media (min-width: 1025px) {

  .top {
    top: 600px;
  }

}
  
</style>
