<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
<link rel="stylesheet" href="https://use.typekit.net/qsa5fag.css">
</head>
<body>
<img src="/fingg-555.jpg" class="bg">
<div class="top">
  <a href="/titles" class="lyrics-link">Lyrics</a>
</div>
<div class="footer">
  <div class="touch">
    <a href="mailto:floribundatunes@duck.com">GET IN TOUCH</a>
  </div>
  <div class="part">
    <em>Je'm is part of</em> OHLUCINDA
  </div>
  <div class="links">
    <a href="/titles">Lyrics</a> |
    <a href="/songs">Songs</a> |
    <a href="/images">Images</a>
  </div>
  <div class="copyright">
    © 2024 All rights reserved
  </div>
</div>
<style>
body {
  margin: 0;
  padding: 0;
}

/* 背景 */
.bg {
  position: fixed;
  top: -200px;
  left: 0;
  width: 100%;
  height: calc(100% + 200px);
  object-fit: cover;
}

/* ───────────────────────────────────────
   【基本エリア】
   ※ 主に iPad横向き（ベース）に合わせた数値にします
   ─────────────────────────────────────── */
.top {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'adobe-caslon-pro', serif;
  font-size: 48px;
  letter-spacing: 0.08em;
  
  top: 180px; /* ◎ iPad横向きでちょうどいい位置に調整してください */
}

.footer {
  position: fixed;
  bottom: 38px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  font-family: 'adobe-caslon-pro', serif;
  color: black;
  width: 100%;
  line-height: 1.6;
}

a {
  color: black;
  text-decoration: none;
  transition: opacity 0.2s ease;
}
a:active {
  opacity: 0.5;
}
.lyrics-link {
  text-decoration: underline;
  text-underline-offset: 6px;
  text-decoration-thickness: 1.5px;
}
.touch {
  font-size: 16px;
  margin-bottom: 6px;
}
.part {
  font-size: 14px;
  margin-bottom: 6px;
}
.links {
  font-size: 14px;
  margin-bottom: 6px;
}
.copyright {
  font-size: 13px;
}
.footer a {
  color: black;
}

/* ───────────────────────────────────────
   【限定：スマホ（iPhone）＆ iPad縦向き】の部屋
   （横幅 820px 以下の画面に適用）
   ─────────────────────────────────────── */
@media (max-width: 820px) {
  .top {
    top: 310px; /* ◎ iPhone縦やiPad縦でちょうどいい位置に調整してください */
  }
}

/* ───────────────────────────────────────
   【限定：Mac / デスクトップ専用】の隔離部屋
   （横幅 1025px 以上の大画面だけに適用）
   ─────────────────────────────────────── */
@media (min-width: 1025px) {    /* ← 118行目：Macの部屋スタート */

  .top {
    top: 300px;
  }                             /* ← 121行目のカッコは「.top」を閉じるだけにする */

  .top a {
    display: inline-block;
    transition: transform 0.3s ease;
  }

  .top a:hover {
    transform: translateY(4px);
    opacity: 1;
  }

}                               /* ← 133行目：ここで最後にMacの部屋を閉じる */
</style>
</body>
</html>
