<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body { 
  font-family: 'Aboreto', cursive; 
  margin: 0; 
  padding: 0; 
}

a { text-decoration: none; color: inherit; }

/* 親を基準にする */
.page-wrap {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 40px 100px;
  gap: 120px;
}

.site-header a { font-size: 70px; }

/* タイトル一覧 */
.list {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 50px;
  width: 60%;
  margin-left: 10%;
}

.list a { font-size: 18px; }

/* ←これがポイント */
.art-wrap {
  position: fixed;
  right: 100px;   /* Eライン */
  width: 260px;
}

/* 中の画像 */
.art {
  width: 100%;
  height: auto;
}

/* BACK */
.back {
  position: fixed;
  bottom: 60px;
  right: 100px;
}

.back a { font-size: 14px; }

@media (max-width: 768px) {
  .art-wrap { display: none; }
}
</style>

</head>

<body>

<div class="page-wrap">

  <div class="site-header">
    <a href="{{ '/' | relative_url }}">JE'M</a>
  </div>

  <div class="list" id="list">
    {% for post in site.posts %}
      <a href="{{ post.url | relative_url }}">{{ post.title | upcase }}</a>
    {% endfor %}
  </div>

</div>

<!-- ここに固定 -->
<div class="art-wrap" id="artWrap">
  <img src="{{ '/che-EDIT.jpg' | relative_url }}" class="art">
</div>

<div class="back">
  <a href="{{ '/' | relative_url }}">BACK TO HOME</a>
</div>

<script>
  const list = document.getElementById('list');
  const artWrap = document.getElementById('artWrap');

  const rect = list.getBoundingClientRect();
  artWrap.style.top = rect.top + "px";
</script>

</body>
</html>
