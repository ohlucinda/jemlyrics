<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: sans-serif;
  margin: 0;
  padding: 0;
  color: #111;
}

a {
  text-decoration: none;
  color: #111;
  transition: color 0.3s ease;
}

a:hover {
  color: #888;
}

/* 全体 */

.page-wrap {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 40px 100px;
  gap: 120px;
}

/* 共通の軸 */

.inner {
  width: 600px;
  max-width: 90%;
}

/* ─── 【基本の設定】 ─── */

.site-header a {
  font-size: 70px;
}

/* 検索ボックスの基本位置 */
.search {
  position: fixed;
  top: 72px; 
  right: 100px;
}

.search-box {
  width: 240px;
  border: none;
  border-bottom: 1px solid #111;
  background: transparent;
  font-family: sans-serif;
  font-size: 18px;
  padding: 8px 0;
  outline: none;
  color: #111;
}

.search-box::placeholder {
  color: #111;
}

/* リストの基本位置 */
.list {
  display: flex;
  flex-direction: column;
  gap: 50px;
  margin-top: 120px;
}

.list a {
  font-size: 18px;
}

/* 画像 */
.art {
  position: fixed;
  right: 100px;
  bottom: 120px;
  width: 240px;
  height: auto;
  max-height: 60vh;
}

/* BACK */
.back {
  position: fixed;
  bottom: 60px;
  right: 100px;
}

.back a {
  font-size: 14px;
}


/* ─── 【限定：スマホ（iPhone）＆ iPad縦向き】の設定 ─── */
@media (max-width: 820px) {

  .art {
    display: none;
  }

  .page-wrap {
    padding: 40px 30px 100px;
    gap: 50px;
  }

  .inner {
    position: relative;
  }

  .site-header a {
    font-size: 50px;
  }

  /* titles.html の真ん中あたり、@media (max-width: 820px) の中 */

  /* スマホ・iPad縦の時の検索ボックス位置 */
  .search {
    position: relative; /* ← absolute から relative に変更します */
    top: 0;             /* ← topの数値をいったん 0 にします */
    left: 0;            /* ← leftの数値を 0 にします */
    margin-top: 30px;   /* ← ロゴと検索ボックスの間の隙間（上下）をここで調整します */
    margin-bottom: -30px; /* ← 検索ボックスと下のリストが離れすぎないように引き締めます */
  }
}

/* ─── 【限定：Mac / デスクトップ専用】の隔離部屋 ─── */
@media (min-width: 1025px) {

  /* Macの検索ボックスの位置は、ここでiPhoneから隔離して調整します */
  .search {
    top: 80px; /* ← ここを 78px や 80px など、下線がロゴと揃うまで増やしてみてください */
  }

  /* Macのリスト開始位置（余白）は、ここでiPhoneから隔離して調整します */
  .list {
    margin-top: 120px; /* ← Mac側の一覧をもっと下げたい場合は、ここを増やします */
  }

}

</style>

</head>

<body>

<div class="page-wrap">

  <div class="inner">

    <div class="site-header">
      <a href="{{ '/' | relative_url }}">Je'm</a>
    </div>

    <div class="search">
      <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="Find lyrics by words"
      >
    </div>

    <div class="list">

{% for post in site.posts %}

<a href="{{ post.url | relative_url }}" data-search="{{ post.content | strip_html | downcase }}">

  {{ post.title | upcase }}

</a>

{% endfor %}

    </div>

  </div>

</div>

<img src="{{ '/che-EDIT.jpg' | relative_url }}" class="art">

<div class="back">

  <a href="{{ '/' | relative_url }}">TO HOME</a>

</div>

<script>

const searchInput = document.getElementById('searchInput');

const items = document.querySelectorAll('.list a');

searchInput.addEventListener('input', function () {

  const keyword = searchInput.value.toLowerCase();

  items.forEach(item => {

    const text = (item.textContent + ' ' + item.dataset.search).toLowerCase();

    if (text.includes(keyword)) {

      item.style.display = '';

    } else {

      item.style.display = 'none';

    }

  });

});

</script>

</body>
</html>
