<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  font-family: 'Aboreto', cursive;
  margin: 0;
  padding: 0;
}

a { text-decoration: none; color: inherit; }

/* 全体 */
.page-wrap {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 40px 100px;
  gap: 120px;
}

/* 共通の軸 */
.inner {
  width: 600px;
  max-width: 90%;
}

/* タイトル */
.site-header a {
  font-size: 70px;
}

/* リスト */
.list {
  display: flex;
  flex-direction: column;
  gap: 50px;
  margin-top: 125px;
}

.list a { font-size: 18px; }

/* 画像 */
.art {
  position: fixed;
  right: 100px;
  bottom: 120px;
  width: 240px;
  height: auto;
  max-height: 60vh;
}

/* BACK */
.back {
  position: fixed;
  bottom: 60px;
  right: 100px;
}

.back a { font-size: 14px; }

/* iPad */
@media (max-width: 1024px) {
  .art { width: 200px; }
}

/* iPad mini / スマホ */
@media (max-width: 820px) {
  .art { display: none; }
}

/* スマホ */
@media (max-width: 768px) {
  .page-wrap { padding: 40px 24px 100px; gap: 50px; }
  .site-header a { font-size: 50px; }

  .list {
  gap: 30px;
  margin-top: 87px;
}
  .list a { font-size: 16px; }

  .back { right: 24px; }
}
</style>
</head>

<body>

<div class="page-wrap">

  <div class="inner">

    <div class="site-header">
      <a href="{{ '/' | relative_url }}">TITLES</a>
    </div>

    <div class="list">
      {% for post in site.posts %}
        <a href="{{ post.url | relative_url }}">{{ post.title | upcase }}</a>
      {% endfor %}
    </div>

  </div>

</div>

<img src="{{ '/che-EDIT.jpg' | relative_url }}" class="art">

<div class="back">
  <a href="{{ '/' | relative_url }}">BACK TO HOME</a>
</div>

</body>
</html>
