<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body { 
  font-family: 'Aboreto', cursive; 
  margin: 0; 
  padding: 0; 
}

a { text-decoration: none; color: inherit; }

.page-wrap {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 40px 100px;
  gap: 120px;
}

.site-header a { font-size: 70px; }

/* 基準にする */
.list {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 50px;
  width: 60%;
  margin-left: 10%;
}

.list a { font-size: 18px; }

/* 画像（完全一致） */
.art {
  position: absolute;
  top: 0;              /* ←これで1行目と完全一致 */
  left: calc(100% + 100px);  /* ←Eライン位置 */
  width: 260px;
  height: auto;
}

/* BACK */
.back {
  position: fixed;
  bottom: 60px;
  right: 100px;
}

.back a { font-size: 14px; }

/* スマホ */
@media (max-width: 768px) {
  .page-wrap { padding: 40px 24px 100px; gap: 50px; }
  .site-header a { font-size: 50px; }

  .list { 
    width: 100%; 
    margin-left: 0; 
    padding-left: 0%; 
    gap: 30px; 
  }

  .list a { font-size: 16px; }

  .back { bottom: 60px; right: 24px; }
  .back a { font-size: 14px; }

  .art { display: none; }
}
</style>

</head>

<body>

<div class="page-wrap">

  <div class="site-header">
    <a href="{{ '/' | relative_url }}">JE'M</a>
  </div>

  <div class="list">
    {% for post in site.posts %}
      <a href="{{ post.url | relative_url }}">{{ post.title | upcase }}</a>
    {% endfor %}

    <img src="{{ '/che-EDIT.jpg' | relative_url }}" class="art">

  </div>

</div>

<div class="back">
  <a href="{{ '/' | relative_url }}">BACK TO HOME</a>
</div>

</body>
</html>
