<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://use.typekit.net/qsa5fag.css">
<link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  padding: 0;
  opacity: 0;
}

/* 背景画像 */
.bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* LYRICS */
.top {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'adobe-caslon-pro', serif;

  letter-spacing: 0.08em;

a {
  color: black;
  text-decoration: none;
}

.lyrics-link {
  text-decoration: underline;
  text-underline-offset: 6px;
  text-decoration-thickness: 1.5px;
}

/* Footer */
.footer {
  position: fixed;
  bottom: 38px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  font-family: 'adobe-caslon-pro', serif;
  color: black;
  width: 100%;
  line-height: 1.6;
}

.touch {
  font-size: 16px;
  margin-bottom: 6px;
}

.touch a {
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-thickness: 1px;
}

.part {
  font-size: 14px;
  margin-bottom: 6px;
}

.links {
  font-size: 14px;
  margin-bottom: 6px;
}

.copyright {
  font-size: 13px;
}

.footer a {
  color: black;
}

</head>

<body>

<img src="/jem5.jpg" class="bg">

<div class="top">

</div>

<div class="footer">

  <div class="touch">
    <a href="mailto:floribundatunes@duck.com">GET IN TOUCH</a>
  </div>

  <div class="part">
    <em>Je'm is part of</em> OHLUCINDA
  </div>

  <div class="links">
    <a href="/lyrics">Lyrics</a> |
    <a href="/songs">Songs</a> |
    <a href="/images">Images</a>
  </div>

  <div class="copyright">
    © 2024 All rights reserved
  </div>

</div>

<script>
window.onload = function() {
  document.body.style.opacity = "1";
};
</script>
