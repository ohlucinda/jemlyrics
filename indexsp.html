<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://use.typekit.net/qsa5fag.css">
<link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  padding: 0;
  opacity: 0; /* ←追加 */
}

/* 背景画像 */
.bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* LYRICS */
.top {
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'adobe-caslon-pro', cursive;
  font-size: 48px;
  letter-spacing: 0.08em;
}

/* アーティスト */
.center {
  position: fixed;
  top: 50%;
  left: 24px;
  transform: translateY(-50%);
  font-family: 'adobe-caslon-pro', cursive;
  font-size: 32px;
  line-height: 1.6;
}

/* 下 */
.bottom {
  position: fixed;
  bottom: 60px;
  right: 24px;
  font-family: 'adobe-caslon-pro', cursive;
  font-size: 16px;
  text-align: right;
}

.copy {
  position: fixed;
  bottom: 30px;
  right: 24px;
  font-family: 'adobe-caslon-pro', cursive;
  font-size: 12px;
  text-align: right;
}

a {
  color: black;
  text-decoration: none;
}

.lyrics-link {
  text-decoration: underline;
}
  
</style>
</head>

<body>

<img src="/jemmusic/jem5.jpg" class="bg">

<div class="top">
  <a href="https://ohlucinda.github.io/jemmusic/lyrics" class="lyrics-link">LYRICS</a>
</div>

<div class="center">
  <a href="https://music.apple.com/jp/artist/jem/1864719862?l=en-US">Apple Music</a><br>
</div>

<div class="bottom">
  <a href="mailto:floribundatunes@duck.com">GET IN TOUCH</a>
</div>

<div class="copy">
  © ALL RIGHTS RESERVED
</div>

<script>
window.onload = function() {
  document.body.style.opacity = "1";
};
</script>

</body>
</html>
